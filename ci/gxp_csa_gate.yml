name: "GxP Automated Computer Software Assurance (CSA) Gate"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  static-analysis:
    name: "1. Lint & Typing Validation (SDLC-SOP-09)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Python Runtime
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Static Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic langgraph fastapi[all]

      - name: Verify PEP 8 & Code Style (Ruff)
        run: ruff check .

      - name: Verify Strict Typing Boundaries (Mypy)
        run: mypy --strict workflow.py server.py

  backend-verification:
    name: "2. Backend Testing & Security Cleansing (Pytest)"
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Python Runtime
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime & Testing Packages
        run: |
          python -m pip install --upgrade pip
          pip install fastapi[all] pydantic langgraph pytest pytest-cov httpx

      - name: Execute Safety & Thread Isolation Tests
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=90 tests/backend/

  frontend-e2e-wcag:
    name: "3. Interface Responsive & WCAG Audits (Playwright)"
    runs-on: ubuntu-latest
    needs: backend-verification
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Setup Python Environment (Backend dependency)
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Backend & Start API
        run: |
          pip install fastapi[all] pydantic langgraph uvicorn
          python server.py &
          echo "FastAPI backend started in the background."

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Launch Frontend Client
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Install Playwright and Browser Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Accessibility, Mobile Scaling, & E2E Tests
        run: npx playwright test tests/e2e/workflow.spec.ts

      - name: Archive Assurance Testing Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-csa-validation-report
          path: playwright-report/
          retention-days: 30

