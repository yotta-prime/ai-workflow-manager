version: '3.8'

services:
  backend-api:
    build:
      context: .
      target: backend-runner
    command: uvicorn server:server --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENV=validation
      - APP_SECRET=gxp-secure-test-token

  frontend-client:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    environment:
      - NEXT_PUBLIC_API_URL=http://backend-api:8000

  e2e-tester:
    build:
      context: .
      target: frontend-runner
    environment:
      - PLAYWRIGHT_HTML_REPORT=/app/playwright-report
    depends_on:
      - backend-api
      - frontend-client
    command: npx playwright test tests/e2e/workflow.spec.ts

